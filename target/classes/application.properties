spring.application.name=tesla
server.port=${TESLA_PORT:8080}
server.address=${TESLA_BIND_ADDRESS:127.0.0.1}
tesla.api.key=${TESLA_API_KEY:local-development-only}
tesla.network.mode=${TESLA_NETWORK_MODE:mock}
tesla.networks.visa.base-url=${TESLA_VISA_BASE_URL:}
tesla.networks.visa.api-token=${TESLA_VISA_API_TOKEN:}
tesla.networks.mastercard.base-url=${TESLA_MASTERCARD_BASE_URL:}
tesla.networks.mastercard.api-token=${TESLA_MASTERCARD_API_TOKEN:}
tesla.networks.amex.base-url=${TESLA_AMEX_BASE_URL:}
tesla.networks.amex.api-token=${TESLA_AMEX_API_TOKEN:}
